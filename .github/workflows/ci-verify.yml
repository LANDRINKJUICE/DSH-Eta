name: Build foundation verify

# M1 根因验证：只核对 Gradle 配置、Kotlin 插件加载与发布身份，不触发 preBuild / 不碰 rootfs。
# DSHA 的 preBuild 依赖离线 rootfs 生成的资产（不在 git），完整打包见 M7 的 Release 工作流。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gradle 配置 + 发布身份核对
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: 核对发布身份与 Kotlin 插件加载
        run: |
          ./gradlew --no-daemon --no-configuration-cache :app:printReleaseIdentity 2>&1 | tee identity.log
          grep -q 'releaseIdentity=etadsh' identity.log
          grep -q 'applicationId=dsh.android.client' identity.log
          grep -q 'certificateSha256=f2c1d39e23a20ac55334bae0cc5e9efd19a73cb11330e9469b33aff9ee60ec8a' identity.log

      - name: 编译 Kotlin 工具层（独立 :etatools 模块，不触发 preBuild/rootfs）
        run: |
          ./gradlew --no-daemon --no-configuration-cache :etatools:compileReleaseKotlin 2>&1 | tee compile.log
          grep -q 'BUILD SUCCESSFUL' compile.log
