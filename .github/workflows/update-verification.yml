name: Update dependency verification metadata

# 一次性工作流：引入新依赖后，用 :etatools:compileReleaseKotlin 解析依赖图并重新生成
# gradle/verification-metadata.xml（含传递依赖的 sha256），然后自动提交推送。
# 手动触发。DSHA 启用了依赖校验，新依赖必须先更新元数据，否则解析失败。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: 重新生成校验元数据并提交
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: 重新生成依赖校验元数据
        run: ./gradlew --no-daemon --write-verification-metadata sha256 :etatools:compileReleaseKotlin

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "no-change"
          else
            git commit -m "chore: 更新依赖校验元数据（datastore/okhttp 等）"
            git push
          fi
