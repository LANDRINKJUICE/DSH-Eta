name: Update dependency verification metadata

# 一次性工作流：引入新依赖（如 Kotlin 2.4.21）后，重新生成 gradle/verification-metadata.xml 并自动提交。
# 手动触发（workflow_dispatch）。DSHA 启用了依赖校验，新依赖必须更新元数据，否则插件/依赖解析失败。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: 重新生成校验元数据并提交
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 重新生成依赖校验元数据
        run: ./gradlew --no-daemon --write-verification-metadata sha256 help

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "no-change"
          else
            git commit -m "chore: 更新依赖校验元数据（引入 Kotlin 2.4.21）"
            git push
          fi
