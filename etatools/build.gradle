plugins {
    id 'com.android.library'
}

// Eta 工具层独立模块：只依赖 Android framework 与标准库，不继承 :app 的 rootfs 资产链，
// 因此可独立编译验证（不触发 preBuild / 不碰 offline-rootfs / dsh-runtime.bin）。
android {
    namespace 'com.deepseekharness.app.etatools'
    compileSdk {
        version = release(37)
    }
    defaultConfig {
        minSdk 30
    }
    // 与 :app 的 flavor 对齐，避免 variant 歧义（:app 有 androidSupport/standard）
    flavorDimensions 'androidSupport'
    productFlavors {
        standard {
            dimension 'androidSupport'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // RootAccess 等用协程；版本取 DSHA verification-metadata 已登记的最小集，避免新增校验条目
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // memory 的 enabled 开关（DataStore Preferences）
    implementation 'androidx.datastore:datastore-preferences:1.3.0'
    // skill 的 GitHub 发现/安装（PublicGitHubSkillSource）
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    // MCP server 单端点 HTTP（EtaMcpServer）
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}

// AGP 9 内置 Kotlin 下，library 模块的 runtimeElements 不会自动声明
// org.jetbrains.kotlin.platform.type，导致 :app（也用内置 Kotlin）依赖时 variant 歧义。
// 显式给 runtime 出向 variant 补齐 androidJvm 平台属性。
import org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType

configurations.matching { it.name.endsWith("RuntimeElements") }.configureEach {
    attributes {
        attribute(KotlinPlatformType.attribute, KotlinPlatformType.androidJvm)
    }
}
